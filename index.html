<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassTrack UI Design Portals</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            color: #3498db;
        }
        .card h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        .card-system {
            background: #34495e;
            color: white;
        }
        .card-system:hover {
            background: #2c3e50;
            color: white;
        }
    </style>
</head>
<body>

    <h1>ClassTrack UI Design</h1>

    <div class="container">
        <a href="ClassTrack-Design-System-Visual.html" class="card card-system">
            <h2>System Design</h2>
        </a>
        <a href="Admin Portal V1/dashboard.html" class="card">
            <h2>Admin Portal</h2>
        </a>
        <a href="Clerk portal V3.1/dashboard.html" class="card">
            <h2>Clerk Portal</h2>
        </a>
        <a href="Parent v-3/dashboard.html" class="card">
            <h2>Parent Portal</h2>
        </a>
        <a href="Teacher V3/teacher-dashboard.html" class="card">
            <h2>Teacher Portal</h2>
        </a>
    </div>

</body>
</html>
